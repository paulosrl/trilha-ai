# Os testes do kit Trilha AI, a cada envio à main e a cada pull request. Só deste repositório:
# o CI que os projetos copiam é o github-verificacao.yml da raiz.
name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Os testes do kit (Python 3 puro, sem dependências)
        run: python3 -m unittest discover -s testes -v
      - name: Os scripts que os projetos copiam passam no ruff (lint e formato, limite de 100)
        run: |
          pipx run ruff==0.17.0 check --isolated --line-length 100 scripts/ ferramentas/
          pipx run ruff==0.17.0 format --isolated --check --line-length 100 scripts/ ferramentas/
