schema: spec-driven

# O OpenSpec do próprio kit. Não é o modelo dos projetos: esse está em modelo/openspec/config.yaml.
context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Write every Portuguese word with its accents.

  Projeto: Trilha AI, o kit-fonte do método PRD → TDD → OpenSpec: o molde que os projetos
  copiam (modelo/), a ferramenta que os cria e atualiza (ferramentas/kit.py) e os testes do kit.

  Stack: Python 3 puro, sem dependências; testes em unittest (python3 -m unittest discover -s
  testes); lint e formato com o ruff 0.17, limite de 100, em modelo/trilha/ e ferramentas/.

  Este repositório não segue o próprio kit: não tem sdd/, PRD nem TDD. Cada change nasce de uma
  descrição curta aprovada pelo usuário (a origem, o comportamento esperado e o que fica fora).
  As regras de manutenção estão no CLAUDE.md, que o agente já carrega; este contexto não as repete.

rules:
  proposal:
    - "Citar a origem na motivação: o achado da auditoria, pelo ID, ou o pedido do usuário."
    - "Listar o que fica fora da change."
  specs:
    - "A palavra normativa é SHALL, MUST, SHALL NOT ou MUST NOT, nunca a tradução: o `openspec validate` cobra SHALL ou MUST em todo requisito."
  tasks:
    - "Para cada cenário ADDED ou MODIFIED, uma tarefa nomeia o teste de testes/test_kit.py que o comprova e dá o comando que o roda."

operations:
  archive:
    guidance:
      - "Depois do archive, validar as specs (openspec validate --all --no-interactive), rodar os testes e o ruff do kit e seguir a regra de versão do CLAUDE.md."
