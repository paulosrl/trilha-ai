schema: spec-driven

# Contexto do projeto para os artefatos do OpenSpec. Preencha o que está entre < e >.
# Só o que um agente não deduz lendo o código; o resto fica no README e no CLAUDE.md.
context: |
  Projeto: <nome>: <uma frase sobre o que é e para quem>.

  Documentos que mandam, nesta ordem (regra do CLAUDE-comum.md), na pasta sdd/: prd-<nome>.md,
  tdd-<nome>.md, decomposicao-<nome>.md, briefing-openspec/briefing-change-NN-<nome>.md; e
  openspec/specs/.
  Cada change nasce de um briefing aprovado; o design.md referencia os ADRs do TDD pelo
  número e não redecide tecnologia. Faltou requisito: volta ao PRD. Faltou decisão
  técnica: volta ao TDD. Não improvise.

  Stack (decidida no TDD; preencha depois da etapa 2): <linguagem e versão, gerenciador,
  banco, interface, lint, tipos, testes>.

  Nome das pastas de changes e specs: a regra está no CLAUDE-comum.md.

  Dados a proteger: <o dado real que nunca entra em teste manual e a variável ou o
  caminho da cópia descartável>.

# Regras por artefato. Vieram das exigências dos briefings e dos commits de correção do
# projeto Consulta Pública; valem para todo repositório que segue o método.
rules:
  proposal:
    - Escrever em PT-BR, com acentos.
    - Dizer o porquê (a motivação e o RF de origem), não o como.
    - Listar o que fica fora da change.
  design:
    - Escrever em PT-BR, com acentos.
    - Referenciar cada decisão técnica herdada pelo ADR do TDD; nunca redecidir tecnologia.
    - Para cada decisão local, dizer a alternativa rejeitada e o motivo.
    - Listar cada teste existente que muda, com o motivo.
  specs:
    - Manter os títulos estruturais do OpenSpec em inglês (Requirement, Scenario, ADDED, MODIFIED, REMOVED, RENAMED).
    - Escrever as cláusulas em PT-BR, com a palavra normativa em inglês: SHALL, MUST, SHALL NOT, MUST NOT, MAY (RFC 2119); o `openspec validate` cobra SHALL ou MUST em todo requisito.
    - Todo requisito cita o RF de origem do PRD; todo cenário cita o CA de origem, ou "derivado de <RF>, sem CA".
    - Cada requisito tem pelo menos um cenário com WHEN/THEN, testável.
    - Um requisito renomeado usa RENAMED com FROM e TO, cada um com o título inteiro entre crases.
  tasks:
    - Escrever em PT-BR, com acentos.
    - Formato de caixa de marcação, "- [ ] N.M Descrição", em ordem de dependência.
    - Para cada cenário ADDED ou MODIFIED, uma tarefa nomeia o teste que o comprova, com o código do critério de aceite no nome do teste.
    - A última tarefa antes do verify é a execução manual, em dado descartável, com o usuário olhando.

operations:
  apply:
    guidance:
      - Marcar cada tarefa como feita assim que terminar e fazer commit por tarefa; reescrever ANDAMENTO.md antes e depois de cada tarefa.
      - Parar antes do verify para a execução manual.
  archive:
    guidance:
      - Depois do archive, validar as specs e conferir o diff de openspec/specs/; atualizar a tabela "Ciclo" da decomposição.
