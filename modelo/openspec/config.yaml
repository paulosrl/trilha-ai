schema: spec-driven

# Contexto do projeto para os artefatos do OpenSpec. Preencha o que está entre < e >.
# Só o que um agente não deduz lendo o código; o resto fica no README e no CLAUDE.md.
context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Write every Portuguese word with its accents.

  Projeto: <nome>: <uma frase sobre o que é e para quem>.

  Stack (decidida no TDD; preencha depois da etapa 2): <linguagem e versão, gerenciador,
  banco, interface, lint, tipos, testes>.

  As regras do método (os documentos de sdd/ e a ordem deles, o ciclo, o nome das pastas) e as
  deste repositório (os nomes dos documentos, os dados a proteger, as exceções) estão no
  CLAUDE-comum.md e no CLAUDE.md, que o agente já carrega; este contexto não as repete.

# Regras por artefato. Vieram das exigências dos briefings e dos commits de correção dos
# projetos que seguem o método; valem para todos eles. Só o que é do método:
# o que o modelo do OpenSpec já pede (o porquê, as alternativas, os cenários WHEN/THEN, o formato
# das tarefas) fica nas instruções dele, que o OpenSpec dá junto com estas.
rules:
  proposal:
    - Citar o RF de origem na motivação; no projeto ainda sem PRD, o requisito do spec que a change corrige.
    - Listar o que fica fora da change.
  design:
    - Referenciar cada decisão técnica herdada pelo ADR do TDD; nunca redecidir tecnologia.
    - Listar cada teste existente que muda, com o motivo.
    - Terminar com a seção "Verificação", que o apply preenche com a evidência de cada cenário.
  specs:
    - "A palavra normativa é SHALL, MUST, SHALL NOT ou MUST NOT, nunca a tradução: o `openspec validate` cobra SHALL ou MUST em todo requisito, e um DEVE em português o reprova."
    - Todo requisito novo ou alterado cita o RF de origem do PRD; todo cenário novo ou alterado cita o CA de origem, ou "derivado de <RF>, sem CA"; o que o delta repete sem mudança fica como está. No projeto ainda sem PRD, que só corrige requisito já existente, a origem fica só no proposal.
    - No RENAMED, o FROM e o TO trazem o título inteiro do requisito entre crases.
  tasks:
    - Cada cenário ADDED ou MODIFIED tem uma tarefa que nomeia o teste que o comprova, com o código do critério de aceite no nome do teste, ou o do requisito quando o cenário não tem critério (no projeto ainda sem PRD, o nome do requisito do spec). Cenário sem teste automatizável diz por quê e qual evidência o substitui.
    - O teste confere o efeito observável (o arquivo existe, a resposta chega, a tela mostra), nunca o valor literal que o código já usa.
    - A última tarefa antes do verify é a execução manual, em dado descartável, com o usuário olhando.

operations:
  apply:
    guidance:
      - Marcar a tarefa de um cenário só quando o teste que o comprova passar; se o teste não existir, criá-lo antes de marcar.
      - Registrar a evidência de cada cenário (o comando e o resultado) na seção "Verificação" do design.md, ou no notas.md da pasta da change quando não houver design.md; nenhum cenário fica comprovado só pela execução manual.
  archive:
    guidance:
      - 'Depois do archive, validar as specs e conferir o diff de openspec/specs/; atualizar a tabela "Ciclo" da decomposição, com o número do pull request da change na célula do archive ("PR #N"); gerar de novo sdd/documentacao.html.'
      - 'O design.md que o propose dispensou não é passo pulado: o aviso de artefato incompleto que o archive dá por ele se confirma, e o notas.md da change faz as vezes dele.'
