<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* A página do método (sdd/documentacao.html): o produto, as decisões e as entregas de um repositório.
   Gerada por scripts/gerar_pagina_sdd.py a partir de sdd/; não se edita à mão. */
:root {
  --papel: #f6f7f9; --folha: #ffffff; --tinta: #17212e; --tinta-suave: #4f5d6e; --linha: #d9dee5;
  --azul: #1f5f8b; --azul-fundo: #e6eef5; --ocre: #9a6412; --ocre-fundo: #f6ecd9;
  --verde: #2f6b45; --verde-fundo: #e3efe6; --codigo-fundo: #eef1f5;
  --fonte-titulo: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --fonte-texto: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --fonte-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #10161e; --folha: #161e28; --tinta: #e4e9ef; --tinta-suave: #a3afbd; --linha: #2b3644;
    --azul: #79b4dd; --azul-fundo: #1b2b3b; --ocre: #e2ad5c; --ocre-fundo: #33281a;
    --verde: #86c39b; --verde-fundo: #1b2e22; --codigo-fundo: #1c2531; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #10161e; --folha: #161e28; --tinta: #e4e9ef; --tinta-suave: #a3afbd; --linha: #2b3644;
  --azul: #79b4dd; --azul-fundo: #1b2b3b; --ocre: #e2ad5c; --ocre-fundo: #33281a;
  --verde: #86c39b; --verde-fundo: #1b2e22; --codigo-fundo: #1c2531; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--fonte-texto); font-size: 1rem; line-height: 1.6; }
.casca { max-width: 74rem; margin: 0 auto; padding-inline: 1rem; padding-block: 1.5rem 3rem; }
a { color: var(--azul); text-underline-offset: 0.15em; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: 3px; }

header.masthead { margin: -1.5rem -1rem 0; padding: 1.25rem 1rem 0; background: linear-gradient(180deg, var(--azul-fundo) 0%, var(--papel) 100%); }
.marca { display: grid; gap: 0.15rem; margin-bottom: 1rem; }
.rotulo { font-family: var(--fonte-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tinta-suave); }
.nome-curto { font-family: var(--fonte-titulo); font-weight: 600; font-size: clamp(1.15rem, 2.4vw, 1.5rem); line-height: 1.25; }
.abas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; align-items: end; }
.abas button {
  font: inherit; text-align: left; cursor: pointer; position: relative; min-width: 0;
  display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 0.75rem; row-gap: 0.1rem; align-items: center;
  padding: 0.85rem 1rem 0.95rem; color: var(--tinta-suave); background: var(--folha);
  border: 1px solid var(--linha); border-bottom: 0; border-radius: 12px 12px 0 0; opacity: 0.8;
}
.abas button:hover { opacity: 1; }
.abas button[aria-selected="true"] { opacity: 1; color: var(--tinta); border-color: var(--azul); border-top-width: 4px; padding-top: calc(0.85rem - 3px); transform: translateY(2px); z-index: 1; }
.abas button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: var(--folha); }
.aba-num { grid-row: 1 / span 2; width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--fonte-mono); font-weight: 500; background: var(--azul-fundo); color: var(--azul); }
.abas button[aria-selected="true"] .aba-num { background: var(--azul); color: #fff; }
.aba-titulo { font-weight: 600; font-size: 1.05rem; line-height: 1.2; }
.aba-desc { font-size: 0.8rem; line-height: 1.35; color: var(--tinta-suave); }
@media (max-width: 56rem) {
  .abas { grid-template-columns: minmax(0, 1fr); gap: 0.35rem; }
  .abas button { border-radius: 10px; border-bottom: 1px solid var(--linha); transform: none; }
  .abas button[aria-selected="true"]::after { display: none; }
}
main.folha-conteudo { background: var(--folha); border: 1px solid var(--linha); border-radius: 0 0 12px 12px; padding: 2rem clamp(1rem, 3vw, 2.5rem) 2.5rem; position: relative; z-index: 0; }
@media (max-width: 56rem) { main.folha-conteudo { border-radius: 12px; margin-top: 0.75rem; } }

.cabeca { display: grid; gap: 0.6rem; padding-bottom: 1.5rem; margin-bottom: 1.75rem; border-bottom: 1px solid var(--linha); }
.cabeca h1 { font-family: var(--fonte-titulo); font-weight: 600; font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.cabeca p { margin: 0; color: var(--tinta-suave); max-width: 64ch; }
.esteira { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.5rem; }
.esteira li { background: var(--papel); border: 1px solid var(--linha); border-radius: 6px; padding: 0.6rem 0.7rem; display: grid; gap: 0.15rem; min-width: 0; }
.esteira .num { font-family: var(--fonte-mono); font-size: 0.75rem; color: var(--tinta-suave); }
.esteira .titulo-change { font-weight: 600; font-size: 0.9rem; line-height: 1.3; }
.selo { justify-self: start; font-family: var(--fonte-mono); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid currentColor; }
.selo.arquivada { color: var(--verde); background: var(--verde-fundo); }
.selo.andamento { color: var(--ocre); background: var(--ocre-fundo); }
.selo.futura { color: var(--tinta-suave); }
.selo.retirada { color: var(--tinta-suave); text-decoration: line-through; }
.esteira a { color: inherit; text-decoration: none; }
.esteira a:hover { text-decoration: underline; }
@media (max-width: 56rem) { .esteira { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 40rem) { .esteira { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.painel { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 2.5rem; align-items: start; }
@media (max-width: 56rem) { .painel { grid-template-columns: minmax(0, 1fr); gap: 1rem; } }
nav.sumario { position: sticky; top: 1rem; padding-right: 0.5rem; border-right: 1px solid var(--linha); max-height: calc(100vh - 2rem); overflow-y: auto; font-size: 0.875rem; }
nav.sumario ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.2rem; }
nav.sumario li.n3 { padding-left: 0.9rem; font-size: 0.82rem; }
nav.sumario a { color: var(--tinta-suave); text-decoration: none; display: block; padding: 0.15rem 0; }
nav.sumario a:hover { color: var(--azul); }
@media (max-width: 56rem) {
  nav.sumario { position: static; max-height: none; border: 1px solid var(--linha); border-radius: 6px; background: var(--papel); padding: 0.75rem 1rem; }
  nav.sumario li.n3 { display: none; }
}
article.doc { min-width: 0; max-width: 46rem; }
article.doc > :first-child { margin-top: 0; }
article.doc h1 { font-family: var(--fonte-titulo); font-weight: 600; font-size: 1.75rem; line-height: 1.2; text-wrap: balance; margin: 0 0 1rem; }
article.doc h2 { font-family: var(--fonte-titulo); font-weight: 600; font-size: 1.4rem; line-height: 1.25; margin: 2.5rem 0 0.75rem; padding-top: 1rem; border-top: 1px solid var(--linha); scroll-margin-top: 1rem; }
article.doc h3 { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 0.5rem; scroll-margin-top: 1rem; }
article.doc h4 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.4rem; color: var(--tinta-suave); scroll-margin-top: 1rem; }
article.doc p, article.doc li { max-width: 68ch; }
article.doc ul, article.doc ol { padding-left: 1.3rem; }
article.doc blockquote { margin: 1rem 0; padding: 0.75rem 1rem; background: var(--azul-fundo); border-radius: 6px; }
article.doc code { font-family: var(--fonte-mono); font-size: 0.86em; background: var(--codigo-fundo); padding: 0.08em 0.3em; border-radius: 3px; overflow-wrap: anywhere; }
article.doc pre { background: var(--codigo-fundo); border: 1px solid var(--linha); border-radius: 6px; padding: 0.9rem 1rem; overflow-x: auto; font-size: 0.85rem; line-height: 1.5; }
article.doc pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.tabela { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--linha); border-radius: 6px; background: var(--folha); }
.tabela table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tabela th, .tabela td { text-align: left; vertical-align: top; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--linha); }
.tabela th { font-weight: 600; background: var(--papel); }
.tabela tr:last-child td { border-bottom: 0; }
.vazio { color: var(--tinta-suave); background: var(--ocre-fundo); border: 1px dashed var(--ocre); border-radius: 6px; padding: 1rem 1.25rem; max-width: 48rem; }
.briefings { list-style: none; padding: 0; margin: 1.5rem 0 0; display: grid; gap: 0.5rem; }
.briefings li { border: 1px solid var(--linha); border-radius: 6px; padding: 0.6rem 0.8rem; }
.briefings summary { cursor: pointer; font-weight: 600; }
.briefings article.doc { margin-top: 0.75rem; max-width: none; }
footer.rodape { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--linha); font-size: 0.85rem; color: var(--tinta-suave); }
.arquivo { font-family: var(--fonte-mono); font-size: 0.86em; border-bottom: 1px dotted var(--tinta-suave); }
</style>

<div class="casca">
  <header class="masthead">
    <div class="marca">
      <span class="rotulo">Método Trilha AI</span>
      <span class="nome-curto" id="nome-curto"></span>
    </div>
    <div class="abas" role="tablist" aria-label="As três partes desta página">
      <button role="tab" id="aba-produto" aria-controls="painel-produto" aria-selected="true">
        <span class="aba-num" aria-hidden="true">1</span>
        <span class="aba-titulo">O produto</span>
        <span class="aba-desc">O PRD: o que o sistema faz e por quê</span>
      </button>
      <button role="tab" id="aba-decisoes" aria-controls="painel-decisoes" aria-selected="false" tabindex="-1">
        <span class="aba-num" aria-hidden="true">2</span>
        <span class="aba-titulo">As decisões</span>
        <span class="aba-desc">O TDD: as decisões técnicas, como ADRs</span>
      </button>
      <button role="tab" id="aba-entregas" aria-controls="painel-entregas" aria-selected="false" tabindex="-1">
        <span class="aba-num" aria-hidden="true">3</span>
        <span class="aba-titulo">As entregas</span>
        <span class="aba-desc">A decomposição em changes, o ciclo de cada uma e os briefings</span>
      </button>
    </div>
  </header>

  <main class="folha-conteudo">
    <header class="cabeca">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
      <ol class="esteira" id="esteira" aria-label="Andamento das changes"></ol>
    </header>
    <section id="painel-produto" role="tabpanel" aria-labelledby="aba-produto">
      <div class="painel"><nav class="sumario" aria-label="Sumário do PRD"><ol></ol></nav><article class="doc"></article></div>
    </section>
    <section id="painel-decisoes" role="tabpanel" aria-labelledby="aba-decisoes" hidden>
      <div class="painel"><nav class="sumario" aria-label="Sumário do TDD"><ol></ol></nav><article class="doc"></article></div>
    </section>
    <section id="painel-entregas" role="tabpanel" aria-labelledby="aba-entregas" hidden>
      <div class="painel"><nav class="sumario" aria-label="Sumário da decomposição"><ol></ol></nav>
        <div><article class="doc"></article><ul class="briefings" id="briefings"></ul></div></div>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>
</div>

<script type="application/json" id="dados">__DADOS__</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";
  var dados = JSON.parse(document.getElementById("dados").textContent);
  var ABAS = ["produto", "decisoes", "entregas"];

  document.getElementById("nome-curto").textContent = dados.nome;
  document.getElementById("titulo").textContent = dados.nome;
  document.getElementById("subtitulo").textContent = dados.resumo;
  document.getElementById("rodape").innerHTML =
    'Gerado a partir da pasta <span class="arquivo">sdd/</span> por <span class="arquivo">scripts/gerar_pagina_sdd.py</span>' +
    (dados.atualizado ? ", em " + dados.atualizado : "") + ".";

  var esteira = document.getElementById("esteira");
  dados.changes.forEach(function (c) {
    var li = document.createElement("li");
    li.innerHTML = '<span class="num"></span><span class="titulo-change"></span><span class="selo"></span>';
    li.querySelector(".num").textContent = "change " + c.numero;
    li.querySelector(".titulo-change").textContent = c.nome;
    var selo = li.querySelector(".selo");
    selo.classList.add(c.estado);
    selo.textContent = c.rotulo;
    esteira.appendChild(li);
  });

  function slug(texto) {
    return texto.trim().toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu, "").replace(/ /g, "-");
  }

  function converter(artigo, texto, aviso) {
    if (!texto) {
      artigo.innerHTML = "";
      var p = document.createElement("p");
      p.className = "vazio";
      p.textContent = aviso;
      artigo.appendChild(p);
      return false;
    }
    if (typeof marked === "undefined") {
      artigo.innerHTML = "";
      var pre = document.createElement("pre");
      pre.textContent = texto;
      artigo.appendChild(pre);
      return false;
    }
    artigo.innerHTML = marked.parse(texto, { gfm: true });
    artigo.querySelectorAll("table").forEach(function (t) {
      var caixa = document.createElement("div");
      caixa.className = "tabela";
      t.parentNode.insertBefore(caixa, t);
      caixa.appendChild(t);
    });
    var vistos = {};
    artigo.querySelectorAll("h1, h2, h3, h4").forEach(function (h) {
      var base = slug(h.textContent), id = base, n = 1;
      while (vistos[id]) id = base + "-" + (n += 1);
      vistos[id] = true;
      h.id = id;
    });
    return true;
  }

  function renderizar(chave, texto, aviso) {
    var painel = document.getElementById("painel-" + chave);
    var artigo = painel.querySelector("article");
    if (!converter(artigo, texto, aviso)) return;
    var sumario = painel.querySelector("nav.sumario ol");
    artigo.querySelectorAll("h2, h3").forEach(function (h) {
      var li = document.createElement("li");
      li.className = h.tagName === "H3" ? "n3" : "n2";
      var a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      sumario.appendChild(li);
    });
  }

  renderizar("produto", dados.prd, "O PRD ainda não foi escrito: esta etapa não existe neste repositório.");
  renderizar("decisoes", dados.tdd, "O TDD ainda não foi escrito: esta etapa não existe neste repositório.");
  renderizar("entregas", dados.decomposicao, "A decomposição em changes ainda não foi feita: esta etapa não existe neste repositório.");

  var lista = document.getElementById("briefings");
  dados.briefings.forEach(function (b) {
    var li = document.createElement("li");
    var det = document.createElement("details");
    var sum = document.createElement("summary");
    sum.textContent = b.titulo;
    det.appendChild(sum);
    var art = document.createElement("article");
    art.className = "doc";
    det.addEventListener("toggle", function () {
      if (det.open && !art.innerHTML) converter(art, b.texto, "");
    });
    det.appendChild(art);
    li.appendChild(det);
    lista.appendChild(li);
  });

  function abrir(chave) {
    ABAS.forEach(function (k) {
      var ativa = k === chave;
      var botao = document.getElementById("aba-" + k);
      botao.setAttribute("aria-selected", ativa ? "true" : "false");
      botao.tabIndex = ativa ? 0 : -1;
      document.getElementById("painel-" + k).hidden = !ativa;
    });
    try { localStorage.setItem("sdd-aba", chave); } catch (e) {}
  }
  ABAS.forEach(function (k) {
    document.getElementById("aba-" + k).addEventListener("click", function () { abrir(k); });
  });
  var inicial = "produto";
  try { inicial = localStorage.getItem("sdd-aba") || inicial; } catch (e) {}
  if (ABAS.indexOf(inicial) < 0) inicial = "produto";
  abrir(inicial);
})();
</script>
